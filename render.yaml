services:
  - type: web
    name: agentic-email-system
    runtime: python
    plan: standard   # DistilBERT (transformers+torch+model weights in RAM)
                      # needs more than the Starter plan's 512MB — standard
                      # gives 2GB. Also must stay an always-on plan either
                      # way: the poller runs as a background thread inside
                      # this process and would die if the plan spun down.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: study-data
      mountPath: /data
      sizeGB: 2   # study.db itself is tiny, but the downloaded DistilBERT
                  # model (~255MB) also lives on this disk so it survives
                  # restarts instead of re-downloading every boot
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: STUDY_DB_PATH
        value: /data/study.db
      - key: CLASSIFIER
        value: distilbert
      - key: DISTILBERT_MODEL_REPO
        sync: false   # the <username>/<repo> you uploaded to via
                       # scripts/upload_model_to_hf.py
      - key: DISTILBERT_MODEL_PATH
        value: /data/distilbert_model
      - key: GOOGLE_OAUTH_CLIENT_SECRETS_PATH
        value: /etc/secrets/oauth_client_secret.json
      - key: OAUTH_REDIRECT_URI
        sync: false   # fill in after the first deploy, once you know the
                       # assigned (or custom) domain — see docs/STUDY_SETUP.md
